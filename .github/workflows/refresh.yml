name: Refresh model database

on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: model-database-refresh
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types before collecting data
        run: npm run typecheck

      - name: Refresh and validate snapshot
        run: npm run update:db
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_ENDPOINTS: "1"
          OPENROUTER_ENDPOINT_CAP: "120"

      - name: Build current artifacts and run deterministic tests
        run: npm test

      - name: Verify redistribution rights before any public write
        run: npm run check:publication
        env:
          AA_REDISTRIBUTION_LICENSE_CONFIRMED: ${{ vars.AA_REDISTRIBUTION_LICENSE_CONFIRMED }}

      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models_db.json
          git diff --cached --quiet || git commit -m "chore(data): refresh model snapshot"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
